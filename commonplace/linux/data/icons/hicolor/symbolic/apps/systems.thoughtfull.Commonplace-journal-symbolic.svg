<!-- GTK fills a shape without the foreground-stroke class instead of recoloring its line. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect class="transparent-fill foreground-stroke" x="6" y="2" width="15" height="20" rx="2" />
  <path class="transparent-fill foreground-stroke" d="M3 7h5M3 12h5M3 17h5M11 8h6M11 12h6" />
</svg>
