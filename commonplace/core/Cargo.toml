[package]
edition.workspace = true
license.workspace = true
name = "commonplace-core"
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "commonplace-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["mobile", "uniffi/cli"]
mobile = ["dep:uniffi", "sync"]
sync = ["dep:iroh", "dep:postcard", "dep:serde", "dep:serde_json", "dep:tokio"]

[dependencies]
iroh = { version = "1.4.1", optional = true }
loro = "1.16.2"
postcard = { version = "1.1.3", features = ["use-std"], optional = true }
pulldown-cmark = "0.13.4"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.48.0", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
], optional = true }
uniffi = { version = "0.32.2", optional = true }
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
