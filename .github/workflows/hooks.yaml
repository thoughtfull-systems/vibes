---
jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31.11.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('devenv.lock', 'commonplace/Cargo.lock') }}
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            commonplace/target
          restore-keys: cargo-${{ runner.os }}-
      - run: nix profile install nixpkgs#devenv
      - run: devenv shell -- prek run --all-files --show-diff-on-failure
      # prek runs only pre-commit hooks, so check the commit messages separately.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'
        run: devenv shell -- gitlint --config .config/gitlint --commits "$BASE..$HEAD"
name: Hooks
"on":
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
